<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bingo Card Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0d0d0d;
      --surface:    #181818;
      --surface2:   #222222;
      --border:     #2a2a2a;
      --accent:     #e8c547;
      --accent-dim: #a88e30;
      --text:       #d8d8d8;
      --text-dim:   #555;
      --success:    #5ab87a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 80px;
    }

    .container { width: 100%; max-width: 520px; }

    header { margin-bottom: 44px; }

    .tool-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 56px;
      letter-spacing: 0.04em;
      color: #fff;
      line-height: 1;
    }
    .tool-name span { color: var(--accent); }

    .tool-sub {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 24px 28px;
      margin-bottom: 12px;
    }

    .section-label {
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 20px;
    }

    .field { margin-bottom: 24px; }
    .field:last-child { margin-bottom: 0; }

    label {
      display: block;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input[type="number"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 22px;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.2s;
      -moz-appearance: textfield;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type="number"]:focus { border-color: var(--accent); }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 3px;
      background: var(--border);
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: var(--accent);
      border-radius: 0;
      cursor: pointer;
      transition: background 0.15s;
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      background: var(--accent);
      border: none;
      border-radius: 0;
      cursor: pointer;
    }
    input[type="range"]:hover::-webkit-slider-thumb { background: #f0d060; }

    .slider-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--accent);
      min-width: 24px;
      text-align: right;
      line-height: 1;
    }

    .field-note {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 6px;
      font-style: italic;
    }

    .total-display {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .total-label {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .total-right { display: flex; align-items: baseline; gap: 8px; }
    .total-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: #fff;
      line-height: 1;
    }
    .total-sub { font-size: 10px; color: var(--text-dim); }

    .btn-generate {
      width: 100%;
      background: var(--accent);
      color: #000;
      border: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 0.1em;
      padding: 17px;
      cursor: pointer;
      transition: background 0.15s, transform 0.08s;
      margin-bottom: 12px;
      display: block;
    }
    .btn-generate:hover:not(:disabled) { background: #f0d060; }
    .btn-generate:active:not(:disabled) { transform: scale(0.99); }
    .btn-generate:disabled {
      background: var(--surface2);
      color: var(--text-dim);
      cursor: not-allowed;
    }

    .progress-card { display: none; }
    .progress-card.visible { display: block; }

    .chunk-readout {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 16px;
    }
    .chunk-counter {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 40px;
      color: var(--accent);
      line-height: 1;
    }
    .chunk-label { font-size: 11px; color: var(--text-dim); }

    .progress-track {
      background: var(--bg);
      height: 3px;
      margin-bottom: 14px;
    }
    .progress-fill {
      background: var(--accent);
      height: 100%;
      width: 0%;
      transition: width 0.35s ease;
    }

    .status-text { font-size: 11px; color: var(--text-dim); min-height: 16px; }
    .status-text.done { color: var(--success); }

    .downloads-card { display: none; }
    .downloads-card.visible { display: block; }

    .download-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .download-item:last-child { border-bottom: none; }

    .download-name { font-size: 11px; color: var(--text-dim); word-break: break-all; }

    .download-btn {
      flex-shrink: 0;
      background: none;
      border: 1px solid var(--accent-dim);
      color: var(--accent);
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 6px 13px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .download-btn:hover { background: var(--accent); color: #000; }
  </style>
</head>
<body>
  <div class="container">

    <header>
      <div class="tool-name">BINGO<span>GEN</span></div>
      <div class="tool-sub">MTC Tool Suite — Card Generator</div>
    </header>

    <div class="card">
      <div class="section-label">Settings</div>

      <div class="field">
        <label>Pages Per Batch</label>
        <div class="slider-row">
          <input type="range" id="pagesPerBatch" min="1" max="10" value="10" oninput="updateTotal()">
          <div class="slider-value" id="pagesPerBatchVal">10</div>
        </div>
        <div class="field-note">2 unique cards per page</div>
      </div>

      <div class="field">
        <label>Number of Batches</label>
        <input type="number" id="numBatches" value="10" min="1" max="500" oninput="updateTotal()">
      </div>

      <div class="field">
        <div class="total-display">
          <span class="total-label">Total</span>
          <div class="total-right">
            <span class="total-value" id="totalDisplay">100</span>
            <span class="total-sub" id="totalCardsSub">pages / 200 cards</span>
          </div>
        </div>
      </div>
    </div>

    <button class="btn-generate" id="generateBtn" onclick="startGeneration()">
      GENERATE
    </button>

    <div class="card progress-card" id="progressCard">
      <div class="section-label">Progress</div>
      <div class="chunk-readout">
        <div class="chunk-counter" id="chunkCounter">0/0</div>
        <div class="chunk-label" id="chunkLabel">batches complete</div>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="status-text" id="statusText"></div>
    </div>

    <div class="card downloads-card" id="downloadsCard">
      <div class="section-label">Downloads</div>
      <div id="downloadsList"></div>
    </div>

  </div>

  <script>
    const TOTAL_SOURCE_IMAGES = 54;
    const GRID_COLS = 4;
    const GRID_ROWS = 4;
    const SRC_W     = 737;
    const SRC_H     = 1131;

    // Reduced canvas size for file efficiency (~56% fewer pixels vs previous)
    const CELL_W    = 150;
    const CELL_H    = Math.round(CELL_W * SRC_H / SRC_W); // ~230px
    const CANVAS_W  = CELL_W * GRID_COLS;                  // 600px
    const CANVAS_H  = CELL_H * GRID_ROWS;                  // ~920px

    const PAGE_W_MM = 279.4;
    const PAGE_H_MM = 215.9;
    const MARGIN_MM = 12.7;
    const GUTTER_MM = 12.7;
    const GRID_W_MM = (PAGE_W_MM - 2 * MARGIN_MM - GUTTER_MM) / 2;
    const GRID_H_MM = GRID_W_MM * (CANVAS_H / CANVAS_W);
    const GRID_Y_MM = MARGIN_MM + (PAGE_H_MM - 2 * MARGIN_MM - GRID_H_MM) / 2;

    const BORDER_PX = 2;
    const JPEG_Q    = 0.88;

    let loadedImages = null;

    // ─── Live Total ────────────────────────────────────────────────────────────

    function updateTotal() {
      const ppb   = parseInt(document.getElementById('pagesPerBatch').value) || 0;
      const nb    = parseInt(document.getElementById('numBatches').value)    || 0;
      const total = ppb * nb;
      document.getElementById('pagesPerBatchVal').textContent = ppb;
      document.getElementById('totalDisplay').textContent     = total;
      document.getElementById('totalCardsSub').textContent    = `pages / ${total * 2} cards`;
    }

    // ─── Image Loading ─────────────────────────────────────────────────────────

    function loadAllImages() {
      return new Promise((resolve, reject) => {
        const images = [];
        let settled = 0, failed = 0;

        for (let i = 1; i <= TOTAL_SOURCE_IMAGES; i++) {
          const img = new Image();
          img.onload = () => {
            settled++;
            if (settled === TOTAL_SOURCE_IMAGES)
              failed > 0 ? reject(new Error(`${failed} image(s) failed to load.`)) : resolve(images);
          };
          img.onerror = () => {
            failed++; settled++;
            setStatus(`⚠ Could not load img${i}.png`);
            if (settled === TOTAL_SOURCE_IMAGES) reject(new Error(`${failed} image(s) failed to load.`));
          };
          img.src = `png/img${i}.png`;
          images.push(img);
        }
      });
    }

    // ─── Card Logic ────────────────────────────────────────────────────────────

    function generateCard() {
      const pool = Array.from({ length: TOTAL_SOURCE_IMAGES }, (_, i) => i);
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      return pool.slice(0, GRID_COLS * GRID_ROWS);
    }

    function drawCard(cardIndices, images) {
      const canvas = document.createElement('canvas');
      canvas.width  = CANVAS_W;
      canvas.height = CANVAS_H;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      for (let i = 0; i < cardIndices.length; i++) {
        const col = i % GRID_COLS;
        const row = Math.floor(i / GRID_COLS);
        const x   = col * CELL_W;
        const y   = row * CELL_H;
        ctx.drawImage(images[cardIndices[i]], x, y, CELL_W, CELL_H);
        ctx.strokeStyle = '#000000';
        ctx.lineWidth   = BORDER_PX;
        ctx.strokeRect(x + BORDER_PX / 2, y + BORDER_PX / 2, CELL_W - BORDER_PX, CELL_H - BORDER_PX);
      }

      return canvas;
    }

    // ─── PDF Generation ────────────────────────────────────────────────────────

    async function generateChunk(pageCount, images) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'letter' });

      for (let p = 0; p < pageCount; p++) {
        if (p > 0) doc.addPage();

        for (let side = 0; side < 2; side++) {
          const card   = generateCard();
          const canvas = drawCard(card, images);
          const data   = canvas.toDataURL('image/jpeg', JPEG_Q);
          const x      = side === 0 ? MARGIN_MM : MARGIN_MM + GRID_W_MM + GUTTER_MM;
          doc.addImage(data, 'JPEG', x, GRID_Y_MM, GRID_W_MM, GRID_H_MM);
        }

        if (p % 5 === 4) await sleep(0);
      }

      return doc;
    }

    // ─── Utilities ─────────────────────────────────────────────────────────────

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function dateStamp() {
      const d = new Date();
      return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
    }

    function setStatus(msg, done = false) {
      const el = document.getElementById('statusText');
      el.textContent = msg;
      el.className = 'status-text' + (done ? ' done' : '');
    }

    function setProgress(pct) { document.getElementById('progressFill').style.width = pct + '%'; }

    function setChunkCounter(done, total) {
      document.getElementById('chunkCounter').textContent = `${done}/${total}`;
    }

    function addDownloadRow(doc, filename, index) {
      const list = document.getElementById('downloadsList');
      const row  = document.createElement('div');
      row.className = 'download-item';
      row.innerHTML = `<span class="download-name">${filename}</span><button class="download-btn" id="dl-${index}">↓ Save</button>`;
      list.appendChild(row);
      document.getElementById('downloadsCard').classList.add('visible');
      document.getElementById(`dl-${index}`).addEventListener('click', () => doc.save(filename));
    }

    // ─── Entry Point ───────────────────────────────────────────────────────────

    async function startGeneration() {
      const pagesPerBatch = parseInt(document.getElementById('pagesPerBatch').value);
      const numBatches    = parseInt(document.getElementById('numBatches').value);

      if (!pagesPerBatch || !numBatches || numBatches < 1) {
        alert('Please enter valid values.');
        return;
      }

      const btn = document.getElementById('generateBtn');
      btn.disabled = true;
      document.getElementById('progressCard').classList.add('visible');
      document.getElementById('downloadsList').innerHTML = '';
      document.getElementById('downloadsCard').classList.remove('visible');

      setChunkCounter(0, numBatches);
      document.getElementById('chunkLabel').textContent = `batch${numBatches !== 1 ? 'es' : ''} complete`;
      setProgress(0);

      try {
        if (!loadedImages) {
          setStatus('Loading source images…');
          loadedImages = await loadAllImages();
        }

        const date = dateStamp();

        for (let i = 0; i < numBatches; i++) {
          const suffix   = numBatches > 1 ? `_${i + 1}of${numBatches}` : '';
          const filename = `BINGO_${date}${suffix}.pdf`;

          setStatus(`Building batch ${i + 1} of ${numBatches}… (${pagesPerBatch} pages)`);

          const doc = await generateChunk(pagesPerBatch, loadedImages);
          addDownloadRow(doc, filename, i);
          setChunkCounter(i + 1, numBatches);
          setProgress(((i + 1) / numBatches) * 100);

          await sleep(60);
        }

        setStatus(`✓ ${numBatches} batch${numBatches !== 1 ? 'es' : ''} ready to download.`, true);

      } catch (err) {
        setStatus(`Error: ${err.message}`);
        console.error(err);
        loadedImages = null;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
